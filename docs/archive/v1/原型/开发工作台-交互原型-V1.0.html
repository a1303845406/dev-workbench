<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>开发工作台 · 设计评审原型 V1.5</title><style>
:root{--bg:#f4f6fa;--ink:#17243b;--muted:#768198;--line:#e3e8f0;--blue:#345de7;--green:#258366;--orange:#b06a15}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:var(--ink);border:1px solid var(--line);padding:8px 15px;border-radius:7px}button:hover{border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{color:white;background:#244acf}.danger{color:#ba394b}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}aside{background:#122039;color:#bac5da;padding:28px 18px;position:sticky;top:0;height:100vh}.logo{color:white;font-size:21px;font-weight:750;letter-spacing:1px}.logo small{display:block;font-size:10px;color:#8398bc;letter-spacing:3px;margin:6px 0 30px}aside button{display:block;width:100%;background:transparent;border:0;color:#adbdd6;text-align:left;margin:5px 0;padding:11px 13px}aside button.active,aside button:hover{background:#273d60;color:white}.aside-label{font-size:11px;color:#7790b3;margin:26px 12px 10px}header{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.tag{display:inline-block;padding:3px 9px;background:#eef2ff;color:var(--blue);border-radius:5px;font-size:12px}.tag.good{background:#e8f5ef;color:var(--green)}.tag.warn{background:#fff3df;color:var(--orange)}.tag.bad{background:#fde8ec;color:#ba394b}main{padding:30px 34px 60px;max-width:1640px;margin:auto}.title{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}h1{font-size:27px;margin:0 0 6px;letter-spacing:-.6px}h2{font-size:18px;margin:0 0 16px}h3{font-size:15px;margin:0 0 9px}p{margin:7px 0 16px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.two{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:18px;box-shadow:0 3px 8px #1c355303}.metric{font-size:28px;font-weight:700;margin:12px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.note{background:#edf2ff;border:1px solid #d9e3ff;border-radius:8px;padding:12px 16px;margin-bottom:18px;color:#405784}.warning{background:#fff6e8;border-color:#f1dab3;color:#94611b}.steps{display:flex;gap:7px;margin:0 0 24px;flex-wrap:wrap}.steps button{flex:1;min-width:105px;text-align:left;font-size:12px}.steps button.active{border-color:var(--blue);color:var(--blue);background:#eef2ff}.bubble{padding:16px;background:#f4f7fc;border-radius:8px;margin:14px 0}.bubble.user{background:#edf1ff;margin-left:45px}textarea,input[type=text],input[type=number],select{border:1px solid #d7deea;border-radius:7px;padding:10px;width:100%;background:white;color:var(--ink)}textarea{resize:vertical;min-height:115px}label{display:block;margin-bottom:12px}input[type=checkbox]{accent-color:var(--blue);margin-right:9px}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{font-weight:500;color:var(--muted);background:#f7f9fc}td,th{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.bar{height:7px;background:#e8edf7;border-radius:8px;overflow:hidden;margin:10px 0}.bar span{height:100%;display:block;background:var(--blue)}.bar.over span{background:#c23b52}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fc;border:1px solid var(--line);padding:16px;border-radius:8px;font:12px/1.8 Consolas,monospace}details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.lane{background:#eaf0f7;padding:14px;border-radius:10px;min-height:320px}.lane .card{padding:15px}.link{padding:0;border:0;background:none;color:var(--blue)}.foot{margin-top:35px;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;padding:28px;width:min(680px,90vw);box-shadow:0 25px 90px #13274840;color:var(--ink)}dialog::backdrop{background:#11244070}#toast{position:fixed;right:28px;bottom:24px;background:#172b48;color:white;padding:14px 22px;border-radius:9px;display:none;z-index:5}.diff del{display:block;background:#ffe8ed;text-decoration:none}.diff ins{display:block;background:#e4f6ee;text-decoration:none}.empty{padding:45px;text-align:center;color:var(--muted)}.updown{display:flex;flex-direction:column;gap:3px}.updown button{padding:2px 8px;font-size:11px;line-height:1.4}.lockrow{opacity:.62}.cursor::after{content:'…';animation:blink 1s infinite}@keyframes blink{50%{opacity:.15}}.tree{display:flex;flex-direction:column;gap:2px;align-items:stretch}.tree button{border:0;background:none;text-align:left;padding:6px 9px;color:var(--ink)}.tree button.on{background:#eef2ff;color:var(--blue)}.chip{margin:2px;padding:3px 9px;font-size:12px}:focus-visible{outline:3px solid #83a7ff;outline-offset:3px}@media(max-width:1100px){.shell{grid-template-columns:185px 1fr}main{padding:22px}.grid,.two,.grid4{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}header{padding:0 22px}}

<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=[['home','项目总览'],['desk','工作台'],['req','需求探索'],['scan','项目规整'],['prompt','提示词工程'],['tests','测试用例'],['board','任务看板'],['assets','资产与版本'],['rules','项目设置'],['tools','协同工具'],['settings','系统设置']];
const stages=['引导对话','碎片提炼','澄清追问','摘要确认','范围冻结','文档编写','评审修订'];
const modules=['需求','概设','原型','详设','数据库设计','后端开发','前端开发','测试','回归','验收'];
const statuses=['待投喂','已投喂','已完成','失败'];
const navPages=[['home','项目总览'],['board','任务看板'],['assets','资产与版本'],['rules','项目设置'],['tools','协同工具'],['settings','系统设置']];
const LAYER={role:1200,global:3400,task:2600,upstream:1800,ref:300};
const SUBDEMO={'T2':[['T2.1','排程结果列表',48000],['T2.2','排程详情页',92000],['T2.3','图表与导出组件',51800]],'T2.2':[['T2.2.1','详情表单与校验',45000],['T2.2.2','明细抽屉与跳转',47000]]};
const tools=[['GitHub Spec Kit','SDD',true],['Taskmaster AI','SDD',false],['OpenSpec','SDD',false],['BMAD-METHOD','多角色规划',false],['Context7','文档检索',true],['Serena','代码智能',true],['AOCI-CODE','代码索引 · 选型待 POC',false],['Repomix','仓库打包',false],['Sequential Thinking','结构化推理',false],['DeepWiki','仓库解释',false]];
const S={page:'home',project:'钛材智能排产模拟器',projects:['钛材智能排产模拟器','开发工作台'],
stage:2,viewStage:2,chat:[],chatCtx:false,ext:false,call:null,scr:['项目语境：本机单用户规划侧工具。','原始表述：R1 希望用 AI 辅助梳理需求。','需求摘要：B1→F1→FR-01；缺口分级跟踪。','轮次记录：（起始）','范围冻结：—','实现形态细化：FastAPI + SPA；文件系统存储。'],
frozen:false,frozen2:false,review:'pending',
step:0,selected:new Set(['需求','概设','后端开发','前端开发','测试','验收']),refComplexity:'中等',tasksSuggest:null,deviated:false,context:true,limit:128000,coef:0.6,
tasks:[{id:'T1',name:'排产参数校验',dep:'无',grp:'G1',est:8200,status:0,d:0,parent:null,children:[],expanded:true},{id:'T2',name:'排产结果展示',dep:'T1',grp:'G2',est:191800,status:0,d:0,parent:null,children:[],expanded:true},{id:'T3',name:'业务回归验证',dep:'T2',grp:'G3',est:6800,status:1,d:0,parent:null,children:[],expanded:true}],
plan:false,ring:0,ringData:[],streaming:false,suspended:false,stale:false,promptTab:'edit',viewRing:0,final:false,

rules:'## 技术栈约定\nPython 3.12 + FastAPI；Vue 3 + TypeScript\n\n## 编码规范\n仅修改任务范围内的文件；禁止硬编码密钥。',rulesWarning:false,occupied:false,provider:'官方-主模型',roots:['D:\\workspace\\示例项目']};
let callback=null;
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',3200)}
function modal(title,body,action,fn){callback=fn;$('dialog').innerHTML=`<h2>${title}</h2>${body}<div class="row" style="justify-content:flex-end;margin-top:22px"><button onclick="closeModal()">取消</button><button class="primary" id="modal-ok" onclick="confirmModal()">${action}</button></div>`;$('dialog').showModal()}
function closeModal(){$('dialog').close();callback=null}
function confirmModal(){if(callback)callback()}
function done(msg){closeModal();render();toast(msg)}
function outbound(fn){modal('确认模型外发范围（模拟）',`<div class="note">原型不会发送网络请求。以下为正式产品的知情确认设计。</div><p><b>目标：</b>${esc(S.provider)} / 示例模型</p><p><b>上下文：</b>${S.page==='req'?'角色提示词、滚动底稿快照'+(S.chatCtx?'、附加项目语境文档':'')+'、本轮输入':'勾选的需求文档、硬约束包 v1.0.0、项目规则、任务说明、直接依赖交接摘要'}</p><p class="muted">确认绑定本次输入快照；内容改变后须重新确认。</p>`,'确认并模拟',()=>{closeModal();fn()})}
function nav(page){S.page=page;render()}
function title(name,sub,actions=''){return `<div class="title"><div><h1>${name}</h1><div class="muted">${sub}</div></div><div class="row">${actions}</div></div>`}
function render(){$('breadcrumb').textContent=S.page==='home'?'项目总览':S.project+' / '+pages.find(p=>p[0]===S.page)[1];$('nav').innerHTML=navPages.map(([id,label])=>{const on=S.page===id||(id==='home'&&['desk','req','scan','prompt','tests'].includes(S.page));return `<button class="${on?'active':''}" onclick="nav('${id}')">${label}</button>`}).join('');$('main').innerHTML=(S.occupied?'<div class="note warning">其他窗口正在编辑此项目。原型只演示占用提示，不执行真实文件写入。</div>':'')+views[S.page]()+'<div class="foot">设计评审原型 V1.5 · 所有模型结果、扫描数据、落盘状态与版本记录均为示例；不代表产品已实现。</div>'}
function home(){const pend=S.stage<7?('S'+(S.stage+1)+' '+stages[S.stage]):'已完成';const pls=[{n:'需求探索流水线',loc:'断点：'+pend,p:'req'},{n:'提示词工程 V1 批次',loc:'断点：R2 环挂起（重试 3/3）',p:'prompt'}];if(!S.projects.includes(S.project))S.project=S.projects[0]||'';const others=S.projects.filter(p=>p!==S.project);return title('项目总览','工作空间入口：当前项目置顶；「工作台」从项目卡片进入，不再占用菜单。','<button class="primary" onclick="newProject()">＋ 新建项目</button>')+`<div class="card" style="border-color:#9db4f5"><div class="row spread"><div class="row"><span class="tag good">● 当前项目</span><span class="tag">${pend}</span></div><button class="primary" onclick="openProject(${S.projects.indexOf(S.project)})">进入工作台 →</button></div><h1 style="margin:14px 0 8px;font-size:24px">${esc(S.project)}</h1><div class="row"><span class="tag">需求探索 → 项目规整 → 提示词工程 → 测试与交付</span><span class="tag">执行跟踪：任务看板</span><span class="tag">产出沉淀：资产与版本</span></div></div><div class="card"><div class="row spread"><h2>未完结流水线 · 断点恢复</h2><span class="tag">FR-06 / AC-06</span></div><table><tr><th>流水线</th><th>断点位置</th><th>操作</th></tr>${pls.map(p=>`<tr><td>${p.n}</td><td>${p.loc}</td><td><button onclick="nav('${p.p}');toast('已从断点恢复（模拟）：前序结果不重算')">恢复 →</button></td></tr>`).join('')}</table><p class="muted">重新打开工作区时列出全部未完结流水线及断点位置，恢复后前序已落盘结果不重算。</p></div><h2>其他项目</h2><div class="grid">${others.length?others.map(p=>{const i=S.projects.indexOf(p);return `<div class="card"><div class="row spread"><span class="tag">设计阶段</span><small>示例项目</small></div><h2 style="margin-top:20px">${esc(p)}</h2><p class="muted">规范文档 / 任务拆分 / 提示词资产</p><div class="row"><button class="primary" onclick="openProject(${i})">进入工作台 →</button><button class="link danger" onclick="deleteProject(${i})">删除</button></div></div>`}).join(''):'<div class="card empty">暂无其他项目。</div>'}</div>`}
function desk(){const st=[
{n:'① 需求探索',d:'FR-01 · 七阶段流水线：从模糊想法到规范需求文档。这是项目的第一阶段。',st:S.stage<7?'进行中 · S'+(S.stage+1)+' '+stages[S.stage]:'已完成',p:'req',c:S.stage<7?'warn':'good'},
{n:'② 项目规整',d:'FR-03 · 存量项目只读扫描：结构画像、图示与整改建议。',st:S.scanned?'结构画像已生成':'未扫描',p:'scan',c:S.scanned?'good':''},
{n:'③ 提示词工程',d:'FR-04 · 模型建议组合 → 任务拆分 → 编排 → 逐环生成与定稿。',st:S.plan?'计划已确认 · 环 '+Math.min(S.ring+1,Math.max(1,S.ringData.length))+' / '+Math.max(1,S.ringData.length):'未开始',p:'prompt',c:S.plan?'warn':''},
{n:'④ 测试与交付',d:'FR-05 · 用例生成、导出与归档入库。',st:S.tGen?'用例集 v'+S.tVer:'未生成用例',p:'tests',c:S.tGen?'good':''}];
return title('项目工作台 · '+esc(S.project),'规划侧四阶段动线：从这里按顺序进入各阶段；执行状态在「任务看板」，产出沉淀在「资产与版本」。','<button onclick="nav(\'home\')">← 项目总览</button>')+`<div class="grid4">${st.map(s=>`<div class="card"><div class="row spread"><h2>${s.n}</h2><span class="tag ${s.c}">${s.st}</span></div><p class="muted">${s.d}</p><button class="primary" onclick="nav('${s.p}')">进入 →</button></div>`).join('')}</div><div class="card"><h2>辅助模块</h2><div class="row"><button onclick="nav('board')">任务看板 · 执行状态跟踪</button><button onclick="nav('assets')">资产与版本 · 产出档案库</button><button onclick="nav('rules')">项目设置</button><button onclick="nav('tools')">协同工具</button></div><p class="muted">四个阶段是主线；看板跟踪「交出去之后执行得怎么样」，资产回答「沉淀了什么、能否追溯」。</p></div>`}
function openProject(i){S.project=S.projects[i];nav('desk')}
function saveTpl(){const sel=$('new-tpl');if(sel&&![...sel.options].some(o=>o.value==='custom')){const o=document.createElement('option');o.value='custom';o.textContent='我的自定义模板（刚保存）';sel.appendChild(o)}toast('已将当前目录结构保存为自定义模板（模拟）')}
function newProject(){modal('新建项目 / 模板与目录预览','<label>项目名称<input id="new-name" type="text" placeholder="输入项目名"></label><label>目录模板<select id="new-tpl"><option value="default">默认模板（含工程规则骨架）</option></select></label><button class="link" onclick="saveTpl()">将当前目录结构保存为自定义模板</button><pre>项目/\n  README.md\n  rules.md\n  docs/需求/\n  docs/过程档案/\n  src/\n  tests/</pre><small>仅添加演示卡片，不创建真实目录。</small><p id="new-error" class="danger"></p>','模拟创建',()=>{const n=$('new-name').value.trim();if(!n||/[\\/:*?"<>|]/.test(n)||S.projects.includes(n)){$('new-error').textContent='名称为空、含非法字符或同名目录已存在，请修改。';return}S.projects.push(n);done('演示项目已添加；未创建真实文件')})}
function deleteProject(i){modal('删除项目 · 二次确认',`<div class="note warning">正式产品删除依赖备份恢复；本原型仅删除演示卡片。</div><label>请输入项目名：${esc(S.projects[i])}<input id="delete-name" type="text"></label>`,'确认删除',()=>{if($('delete-name').value!==S.projects[i]){toast('名称不匹配，已阻断');return}S.projects.splice(i,1);done('演示项目已删除')})}
function artTable(head,rows){return '<table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>'}
function artifact(s){
if(s===0)return artTable(['编号','原始表述','模糊点标注'],[['R1','想给车间做一个排产工具','[模糊] 使用者与规模'],['R2','要能自动排','[模糊] 自动化边界'],['R3','最好能看报表','[模糊] 报表形态']]);
if(s===1)return artTable(['编号','类别','描述','来源','优先级','状态'],[['B1','B','提升排产效率','R1','P0','已确认'],['F1','F','工单参数校验','R2','P0','已确认'],['F2','F','排程结果展示','R3','P1','澄清中'],['N1','N','本机响应秒级','R5','P1','已确认'],['C1','C','不写代码，产出提示词','R1','P0','已确认']])+'<p class="muted">缺口清单：P0 并发规模（已关闭）· P1 报表形态（澄清中）· P2 导出格式（跟踪）</p>';
if(s===2)return artTable(['轮次','澄清问题（≤3 问 · 选择题优先）','结论'],[['第 1 轮','① 使用者是调度员还是管理层？② 是否仅本机使用？③ 报表要图表还是清单？','调度员 / 本机 / 先清单'],['第 2 轮','① 自动排产失败时如何处理？② 是否保留人工确认门？','保留人工确认门']]);

function suggestModules(){outbound(()=>{const preset=S.refComplexity==='简单'?['需求','后端开发','测试','验收']:S.refComplexity==='复杂'?modules.slice():['需求','后端开发','测试','验收'];const reasons={T1:'纯后端校验逻辑，无需前端与数据库建模',T2:'展示层改动，涉及前端组件与联调',T3:'回归验证，以测试/回归模块为主'};S.tasksSuggest=S.tasks.filter(t=>!t.parent).map(t=>({id:t.id,mods:new Set(t.id==='T2'?['需求','前端开发','测试','验收']:preset),reason:reasons[t.id]||'按参考档位给出'}));S.deviated=false;resetPlan();render();toast('已获取逐任务组合建议（模拟）；请在建议上做人工决策')})}

function nextRing(){if(!S.plan){toast('请先确认编排计划');return}if(S.stale){toast('HANDOFF_STALE：存在过期交接摘要，请先重新生成');return}ensureRing();while(S.ring<S.ringData.length&&S.ringData[S.ring].status==='final')S.ring++;if(S.ring>=S.ringData.length){S.step=5;render();return}const cur=S.ringData[S.ring];if(cur.status==='suspended'){toast('环已挂起，请先恢复');return}const bs=budgetState(S.ring);if(bs.k===2){toast('BUDGET_EXCEEDED_BLOCKED：压缩上游层后仍超预算；请调大上下文上限或拆分上游任务');return}outbound(()=>{const done=S.ring;S.suspended=false;cur.compressed=bs.k===1;S.streaming=true;render();setTimeout(()=>{cur.text=ringPrompt(done);cur.status='draft';cur.version=Math.max(1,cur.version||1);S.streaming=false;S.viewRing=done;S.final=false;S.ring=done+1;render();toast('R'+(done+1)+' 已生成并落盘'+(done+1<S.ringData.length?'，自动推进至 R'+(done+2):'；全部环完成')+'（自动推进：定稿仅约束归档导出与摘要取材）')},900)})}
function simulateFail(){if(!S.plan){toast('请先确认编排计划');return}ensureRing();if(S.ring>=S.ringData.length){toast('全部环已完成');return}const r=S.ringData[S.ring];if(r.status!=='pending'){toast('当前环不在可执行状态');return}r.retries++;if(r.retries>=3){r.status='suspended';S.suspended=true;toast('连续失败 3/3：环已挂起；人工介入后可恢复')}else{toast('第 '+r.retries+'/3 次失败（Provider 超时，可重试）')}render()}
function resumeRing(){S.suspended=false;ensureRing();const r=S.ringData[S.ring];if(r&&r.status==='suspended'){r.status='pending';r.retries=0}render();toast('已恢复挂起环，重试计数重置（模拟）')}
function selectRing(i){ensureRing();S.viewRing=Math.min(i,S.ringData.length-1);S.final=S.ringData[S.viewRing].status==='final';S.promptTab='edit';render()}
function editPrompt(v){ensureRing();const r=S.ringData[S.viewRing]||(S.ringData[S.viewRing]={module:'?',status:'draft',version:1,stale:false,retries:0,text:'',compressed:false});r.text=v;if(r.status==='final'&&!r.stale){r.stale=true;S.stale=true;toast('已修改定稿内容：交接摘要过期，下游环阻断（HANDOFF_STALE）')}S.final=false}
function finalizeRing(i){ensureRing();const r=S.ringData[i];if(r.status==='final'&&!r.stale){toast('已是定稿');return}r.status='final';r.stale=false;S.stale=false;S.final=true;render();toast('R'+(i+1)+' 已定稿 v'+r.version+'；可归档导出；若内容有变更，下游摘要将标记过期')}
function regenerate(i){outbound(()=>{ensureRing();const r=S.ringData[i];r.stale=false;S.stale=false;r.version++;S.final=true;render();toast('已按最新定稿重新生成摘要 v'+r.version+'（模拟）')})}
function sanitize(){if(!S.final){toast('未定稿，不可导出');return}ensureRing();const r=S.ringData[S.viewRing];if(r&&r.stale){toast('HANDOFF_STALE：摘要过期，请先重新生成');return}modal('脱敏审查 · 导出门',`<div class="note warning">命中演示 password 字段（severity: confirm）。本原型只展示门禁，不复制真实内容、不生成产品导出文件。</div><pre>password=••••••</pre><label><input id="sanitize-ack" type="checkbox">已审查此演示命中项</label><label>导出格式<select id="exp-fmt"><option>通用 Markdown</option>${tools.filter(t=>t[1]==='SDD'&&t[2]).map(t=>`<option>${t[0]}（spec/plan/tasks 对齐）</option>`).join('')}</select></label><label><input id="exp-arch" type="checkbox">同时归档入库到项目资产库</label>`,'模拟放行',()=>{if(!$('sanitize-ack').checked){toast('请先审查命中项');return}S.archived=$('exp-arch').checked;closeModal();copyModal($('exp-fmt').value)})}
function copyModal(fmt){modal('复制 / 导出（模拟）','<p>格式：'+fmt+'</p><textarea readonly style="min-height:180px">## 通用硬约束包 v1.0.0\n……（已脱敏的提示词全文，仅供演示）</textarea><p class="muted">localhost 属安全上下文，Clipboard 可用；若部署形态变为非安全上下文，将降级为「手动全选复制」并提示（NFR-06）。</p>','完成',()=>done(S.archived?'已模拟复制，并归档到项目资产库（未生成真实文件）':'已模拟复制；未生成真实导出文件'))}
function tests(){return title('测试用例','项目第四阶段 · FR-05 功能与业务必选，性能可选；用例必须回链需求与任务','<button onclick="nav(\'desk\')">← 返回工作台</button>')+(S.tGen?`<div class="card"><div class="row spread"><h2>用例集 v${S.tVer} <small class="muted">（历史版本保留，可切换查看）</small></h2><div class="row"><label style="margin:0"><input type="checkbox" ${S.perf?'checked':''} onchange="S.perf=this.checked;render()">包含性能用例</label><button onclick="regenTests()">重生成</button></div></div><table><tr><th>编号</th><th>类别</th><th>前置 / 步骤</th><th>预期结果</th><th>覆盖</th></tr><tr><td>TC-F-001</td><td>功能</td><td>输入非法数量并提交</td><td>字段级错误，不生成计划</td><td>FR-03 / T1</td></tr><tr><td>TC-B-001</td><td>业务</td><td>工单超过产能，生成模拟排程</td><td>明确缺口并给出可解释建议</td><td>FR-03 / T3</td></tr>${S.perf?'<tr><td>TC-P-001</td><td>性能</td><td>加载基准数据集</td><td>阈值待 POC 冻结，不虚报通过</td><td>FR-03 / T3</td></tr>':''}</table><p class="muted">未勾选性能时不含 TC-P-*；每条用例标注覆盖的需求/任务编号（FR-05 规则 3）。</p></div>`:'<div class="card empty">尚未生成用例。</div>')+`<div class="card">${S.tGen?'':'<button class="primary" onclick="genTests()">生成用例（来自测试环）</button>'}</div><div class="card"><h2>回归提示词 · 独立模块</h2><p>人工指定范围：参数校验、排程结果展示。回归不自动圈定代码改动面。</p><button onclick="toast('已选择回归范围（演示）；未调用模型')">确认范围示例</button></div>`}
function genTests(){outbound(()=>{S.tGen=true;S.tVer=1;render();toast('已生成用例集 v1（模拟）')})}
function regenTests(){outbound(()=>{S.tVer++;render();toast('已重生成 v'+S.tVer+'；v'+(S.tVer-1)+' 历史版本保留（FR-05）')})}
function board(){const leaves=S.tasks.filter(t=>!t.children.length);return title('任务看板','外部 IDE 执行状态的跟踪板：工作台不执行代码，这里只登记执行结果')+`<div class="note"><b>这是什么：</b>拆分出的<b>叶子任务</b>会「投喂」给外部 IDE 执行。这里登记执行结果（待投喂 → 已投喂 → 已完成 / 失败），失败必须写明返工原因；失败后可<b>重新拆分</b>或<b>调整范围后重试</b>，形成执行反馈闭环。它回答的是——<b>规划交出去之后，执行得怎么样</b>（G5）。</div><div class="board">${statuses.map((status,i)=>`<div class="lane"><h3>${status} <small>${leaves.filter(t=>t.status===i).length}</small></h3>${leaves.filter(t=>t.status===i).map(t=>`<div class="card"><div class="row spread"><span class="tag">${t.id}</span><small>层级 L${(t.d||0)+1}</small></div><h3 style="margin-top:12px">${esc(t.name)}</h3><small>依赖：${t.dep} · ${t.est.toLocaleString()} tokens</small>${t.resplit?'<div class="row" style="margin-top:8px"><span class="tag">已细化拆分 → 子任务待投喂</span></div>':''}<p></p><select aria-label="${t.id} 状态" onchange="setTask('${t.id}',Number(this.value))">${statuses.map((n,j)=>`<option value="${j}" ${i===j?'selected':''}>${n}</option>`).join('')}</select>${i===3&&!t.resplit?`<div class="row" style="margin-top:8px"><button class="link" onclick="resplitFailed('${t.id}')">重新拆分</button><button class="link" onclick="retryAdjusted('${t.id}')">调整后重试</button></div>`:''}</div>`).join('')}</div>`).join('')}</div>`}
function setTask(id,status){const task=S.tasks.find(t=>t.id===id);if(status===3){modal('记录失败原因','<textarea id="failure" placeholder="输入返工原因"></textarea>','保存演示反馈',()=>{const note=$('failure').value.trim();if(!note){toast('请输入原因');return}task.status=status;S.feedback.push(id+'：'+note);done('失败状态与备注已模拟记录')})}else{task.status=status;render()}}
const VER={1:['约束包 v1.0.0','参数异常：返回错误','覆盖 FR-03'],2:['约束包 v1.0.0','参数异常：返回可追溯字段错误','覆盖 FR-03'],3:['约束包 v1.0.0','参数异常：返回可追溯字段错误','新增：与 T3 回归用例对齐']};
const vmeta=v=>'v'+v+' · 09-2'+(7+v)+' 15:0'+v+' · 复杂度中等 · 系数 0.6 · 约束包 v1.0.0';
function assets(){const mods=[['后端开发','T1'],['前端开发','T2']];const node=S.assetNode;const vers=node==='T1'?S.versions:[1];return title('资产与版本','项目规划产出的档案库：版本只增不改 · 回滚创建新版本 · 原件与导出物分离')+`<div class="note"><b>这是什么：</b>本项目的<b>知识资产档案</b>——需求文档、各环提示词（版本只增不改、可对比可回滚）、测试用例、导出物。它回答的是——<b>我们沉淀了什么，能否追溯与复用</b>；执行反馈与协同工具使用效果也汇在这里（G1 / G6）。</div><div class="two"><div class="card"><div class="two" style="grid-template-columns:1fr 2.2fr"><div><h3>提示词库</h3><div class="tree">${mods.map(([m,t])=>`<small class="muted" style="margin-top:6px">${m}</small><button class="${node===t?'on':''}" onclick="S.assetNode='${t}';render()">${t} · 排产${t==='T1'?'参数校验':'结果展示'}</button>`).join('')}${S.archived?'<small class="muted" style="margin-top:6px">导出物</small><button class="on">exports/（已归档）</button>':''}</div></div><div><h3>${node} 提示词版本</h3><div class="row"><label>左侧版本<select id="left-version">${vers.map(v=>`<option>${v}</option>`).join('')}</select></label><label>右侧版本<select id="right-version">${vers.map(v=>`<option ${v===vers[vers.length-1]?'selected':''}>${v}</option>`).join('')}</select></label><button onclick="showDiff()">对比</button><button onclick="rollback()">回滚左侧版本</button></div><div class="row" style="margin-top:14px">${vers.map(v=>'<span class="tag" title="生成参数随版本归档">'+vmeta(v)+'</span>').join('')}</div><div id="diff" class="diff"><p class="muted">选择任意两版，查看行级差异。</p></div></div></div></div><div class="card"><h2>执行 / 工具反馈</h2>${S.feedback.length?S.feedback.map(f=>`<p>· ${esc(f)}</p>`).join(''):'<p class="muted">暂无反馈，可从任务看板记录失败原因。</p>'}<div class="row"><select id="fb-tool" style="width:auto"><option>Context7</option><option>Serena</option><option>Spec Kit</option></select><input id="fb-note" type="text" placeholder="工具使用效果备注" style="flex:2"><button onclick="addToolFb()">记录工具反馈</button></div><button onclick="nav('board')">进入任务看板</button></div></div>`}
function showDiff(){const a=Number($('left-version').value),b=Number($('right-version').value);const A=VER[Math.min(a,3)]||VER[1],B=VER[Math.min(b,3)]||VER[1];const line=(arr,other)=>arr.map((l,i)=>other[i]===l?esc(l):(a<=b?('<del>'+esc(l)+'</del>'):('<ins>'+esc(l)+'</ins>'))).join('\n');$('diff').innerHTML=`<div class="two"><pre>v${a}\n${line(A,B)}</pre><pre>v${b}\n${line(B,A)}</pre></div><small>示例差异展示，并非真实版本文件对比。</small>`}
function rollback(){const v=Number($('left-version').value);S.versions.push(S.versions.at(-1)+1);render();toast('以 v'+v+' 为内容创建新演示版本，历史保留')}
function addToolFb(){const t=$('fb-tool').value,n=$('fb-note').value.trim();if(!n){toast('请输入备注');return}S.feedback.push('tool:'+t+'：'+n);render();toast('已记录；可据此在协同工具页调整启用状态（FR-08 反馈闭环）')}
function rules(){return title('项目设置','工程规则 · Provider · 扫描白名单 · 占用演示')+`<div class="grid"><div class="card"><h2>项目信息</h2><p>名称：${esc(S.project)}<br>模板：默认模板</p><label>Provider（写入 project.json，仅存名称）<select onchange="S.provider=this.value;toast('Provider 已切换（模拟）')">${['官方-主模型','备用中转站'].map(p=>`<option ${S.provider===p?'selected':''}>${p}</option>`).join('')}</select></label></div><div class="card"><h2>扫描白名单 scan_roots</h2><div class="row">${S.roots.map((r,i)=>`<span class="tag">${esc(r)} <button class="link danger" onclick="S.roots.splice(${i},1);render()">×</button></span>`).join('')}</div><div class="row" style="margin-top:10px"><input id="new-root" type="text" placeholder="新增允许扫描的根目录" style="flex:2"><button onclick="const v=$('new-root').value.trim();if(v){S.roots.push(v);render();toast('白名单已更新（模拟）')}">添加</button></div><p class="muted">白名单外的路径扫描会被拒绝（NFR-04）。</p></div></div><div class="card"><h2>工程规则 rules.md</h2><div class="note">硬约束在前，项目补充在后；内置硬约束包 v1.0.0 · 不可关闭。关键词告警不是语义证明，仍须人工审阅。</div><textarea id="rules-text" style="min-height:200px">${esc(S.rules)}</textarea>${S.rulesWarning?'<div class="note warning">冲突告警：命中「允许硬编码」。关键词级演示；否定语境及同义改写可能误报或漏报。</div>':''}<p></p><div class="row"><button class="primary" onclick="saveRules()">保存演示规则</button><button onclick="S.occupied=!S.occupied;render()">切换占用警告演示</button></div></div>`}
function saveRules(){S.rules=$('rules-text').value;S.rulesWarning=S.rules.includes('允许硬编码');render();toast('规则仅保存在当前页面内存')}
function toolPage(){return title('协同工具注册表','仅登记、格式适配与文字指引；不探测、不调用外部工具','<button class="primary" onclick="addTool()">＋ 添加工具</button>')+`<div class="note">${tools.some(t=>t[2])?'已启用工具将出现在相应提示词指引和导出选择中。':'全部禁用，需求探索与提示词主流程不受影响。'}</div><div class="card"><table><tr><th>工具</th><th>类别</th><th>项目级启用</th><th>方式</th><th>操作</th></tr>${tools.map((t,i)=>`<tr><td>${t[0]}</td><td>${t[1]}</td><td><input type="checkbox" aria-label="启用 ${t[0]}" ${t[2]?'checked':''} onchange="tools[${i}][2]=this.checked;render()"></td><td>${t[1]==='SDD'?'导出格式对齐（具体版本待验证）':'文字指引 / 人工并行使用'}</td><td><button class="link danger" onclick="delTool(${i})">删除</button></td></tr>`).join('')}</table><p class="muted">支持增删改（FR-08 规则 1）；使用效果反馈（资产页）可反过来调整启用状态。</p></div>`}
function addTool(){modal('添加协同工具','<label>工具名称<input id="tool-name" type="text" placeholder="如：我的内部 Wiki"></label><label>类别<select id="tool-cat"><option>文档检索</option><option>代码智能</option><option>SDD</option><option>仓库打包</option><option>结构化推理</option></select></label>','添加（模拟）',()=>{const n=$('tool-name').value.trim();if(!n){toast('请输入名称');return}tools.push([n,$('tool-cat').value,true]);done('已添加工具（模拟），仅登记不调用')})}
function delTool(i){modal('删除协同工具','<p>确认从项目注册表删除「'+tools[i][0]+'」？删除不影响主流程（CON-13）。</p>','删除（模拟）',()=>{tools.splice(i,1);done('已删除（模拟）')})}
function settings(){return title('系统设置','只读配置视图 · 正式系统通过服务端配置文件维护')+`<div class="note warning">以下为配置样例，不是正在运行的服务。密钥不会写入项目目录或明文备份。</div><div class="grid"><div class="card"><h2>Provider</h2><p>官方-主模型：***<br>备用中转站：***<br>当前项目使用：${esc(S.provider)}<br>状态：未连接</p></div><div class="card"><h2>预算与索引</h2><p>保守系数：0.6（待 POC）<br>交接摘要：≤500 字符<br>AOCI-CODE：候选，许可待核验<br>tree-sitter：备选</p></div><div class="card"><h2>存储与备份</h2><p>文件系统 · 无数据库<br>备份：每日 / 保留 30 天（拟定）<br>绑定：localhost 回环<br>网络暴露：禁止</p></div></div><div class="grid"><div class="card"><h2>复杂度映射（G-08）</h2><p>参考档位（作为模型建议的先验）<br>简单 = 需求+后端开发+测试+验收<br>中等 = +概设+前端开发<br>复杂 = 全部 10 模块<br>逐任务人工调整偏离会记入生成参数</p></div><div class="card"><h2>硬约束包 / 脱敏</h2><p>硬约束包 v1.0.0（不可关闭）<br>脱敏规则：api-key(block) · password(confirm) · intranet(confirm)</p></div><div class="card"><h2>模块模板</h2><p>10 个模块角色模板 × v1.0<br>修改配置文件后热加载，无需重启（AC-11）</p></div></div><div class="card"><h2>本次设计阶段边界</h2><p>仅设计文档、drawio 图与静态原型。未创建后端服务，未安装依赖，未执行 POC，未启动开发服务器。</p></div>`}
const views={home,desk,req:requirements,scan,prompt:prompts,tests,board,assets,rules,tools:toolPage,settings};
render();
</script></body></html>
